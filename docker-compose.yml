services:
  client:
    image: ghcr.io/readest/readest:0.12.8
    container_name: readest
    env_file: ./data/.env
    environment:
      SUPABASE_URL: http://kong:8000
      S3_ENDPOINT: http://minio:9000
      API_BASE_URL: ""
    ports:
      - "3030:3000"
    depends_on:
      - kong
      - minio
    restart: unless-stopped

  db:
    image: supabase/postgres:15.8.1.085
    container_name: readest-db
    env_file: ./data/.env
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_min_messages=fatal
    volumes:
      - ./readest/docker/volumes/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./readest/docker/volumes/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
      - ./readest/docker/volumes/db/init/schema.sql:/docker-entrypoint-initdb.d/init-scripts/100-schema.sql:ro
      - ./readest/docker/volumes/db/migrations:/readest-migrations:ro
      - ./readest/docker/volumes/db/apply-migrations.sh:/docker-entrypoint-initdb.d/zz-readest-migrations.sh:ro
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supabase_admin -h localhost -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  kong:
    image: kong:2.8.1
    container_name: readest-kong
    env_file: ./data/.env
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
    entrypoint: bash -c 'eval "echo \"$$(cat ~/temp.yml)\"" > ~/kong.yml && /docker-entrypoint.sh kong docker-start'
    ports:
      - "8000:8000"
    volumes:
      - ./readest/docker/volumes/api/kong.yml:/home/kong/temp.yml:ro
    restart: unless-stopped

  auth:
    image: supabase/gotrue:v2.185.0
    container_name: readest-auth
    env_file: ./data/.env
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  rest:
    image: postgrest/postgrest:v14.3
    container_name: readest-rest
    env_file: ./data/.env
    environment:
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_USE_LEGACY_GUCS: "false"
    command: ["postgrest"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    container_name: readest-minio
    env_file: ./data/.env
    command: server /data
    ports:
      - "9000:9000"
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-setup:
    image: quay.io/minio/mc:latest
    container_name: readest-minio-setup
    env_file: ./data/.env
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set readest http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing readest/$$S3_BUCKET_NAME
      "
